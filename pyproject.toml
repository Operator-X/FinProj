[project]
name = "wc-margin-engine"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Operator-X", email = "114176594+Operator-X@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting>=2.3.2",
    "fastapi>=0.162.0",
    "gymnasium>=1.4.0",
    "httpx>=0.28.1",
    "kaggle>=2.2.5",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "stable-baselines3>=2.9.0",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
wc-margin-engine = "wc_margin_engine:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
